[project]
name = "repograph"
version = "0.1.0"
description = "Local repository inventory and health CLI for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.26.0",
    "rich>=13.0.0",
    "onnxruntime>=1.25.0",
    "fastembed>=0.8.0,<0.9",
    "numpy>=1.26.0",
    "pathspec==0.12.1",
    "pyyaml>=6.0",
    "pydantic>=2.10",
]

[project.scripts]
repograph = "repograph.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repograph"]

[tool.hatch.build.targets.wheel.force-include]
"src/repograph/store/schema.sql" = "repograph/store/schema.sql"
"src/repograph/store/schema_v2.sql" = "repograph/store/schema_v2.sql"
"src/repograph/store/schema_v3.sql" = "repograph/store/schema_v3.sql"
"src/repograph/store/schema_v4.sql" = "repograph/store/schema_v4.sql"
"src/repograph/store/schema_v5.sql" = "repograph/store/schema_v5.sql"
"docs/label-batch.md" = "repograph/docs/label-batch.md"
"src/repograph/prompts/label-entry.md" = "repograph/prompts/label-entry.md"
"src/repograph/guide/fragments/quickstart.md" = "repograph/guide/fragments/quickstart.md"
"src/repograph/guide/fragments/workflow.md" = "repograph/guide/fragments/workflow.md"
"src/repograph/guide/fragments/doctor.md" = "repograph/guide/fragments/doctor.md"
"src/repograph/guide/fragments/scan-config.md" = "repograph/guide/fragments/scan-config.md"
"src/repograph/guide/fragments/label-batches.md" = "repograph/guide/fragments/label-batches.md"
"src/repograph/guide/fragments/change-journal.md" = "repograph/guide/fragments/change-journal.md"
"src/repograph/guide/fragments/semantic-layer.md" = "repograph/guide/fragments/semantic-layer.md"
"src/repograph/guide/fragments/export.md" = "repograph/guide/fragments/export.md"
"src/repograph/guide/fragments/exit-codes.md" = "repograph/guide/fragments/exit-codes.md"
"src/repograph/guide/fragments/canonical-store.md" = "repograph/guide/fragments/canonical-store.md"
"src/repograph/guide/fragments/mini-lab.md" = "repograph/guide/fragments/mini-lab.md"
"src/repograph/guide/fragments/anti-patterns.md" = "repograph/guide/fragments/anti-patterns.md"

[dependency-groups]
dev = ["pytest>=8.0", "hatchling", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "semantic_integration: optional real FastEmbed model test (not run in default CI)",
]
